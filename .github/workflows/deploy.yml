name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSHH_KEY }}

      - name: Add hosts to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSHH_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Copy deploy key to EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSHH_USER }}@${{ secrets.SSHH_HOST }} \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh && cat > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key" \
            <<< "${{ secrets.DEPLOY_KEY }}"

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSHH_USER }}@${{ secrets.SSHH_HOST }} << 'EOF'
            set -e

            # Cleanup ssh-agent on exit automatically
            trap 'eval $(ssh-agent -k) 2>/dev/null || true' EXIT

            echo "======================================"
            echo "  PRODUCTION DEPLOY STARTED"
            echo "  Time: $(date)"
            echo "======================================"

            echo "--- Setup deploy key ---"
            chmod 600 ~/.ssh/deploy_key
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/deploy_key

            echo "--- Adding github.com to known_hosts ---"
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

            echo "--- Test GitHub connection ---"
            ssh -T git@github.com || true

            echo "--- Removing git lock if exists ---"
            rm -f /opt/odoo/custom_addons/odoo-latest-26/.git/index.lock

            echo "--- Moving to project directory ---"
            cd /opt/odoo/custom_addons/odoo-latest-26

            echo "--- Fetching latest code ---"
            git fetch origin main

            echo "--- Changes being deployed ---"
            git log HEAD..origin/main --oneline || true

            echo "--- Resetting to origin/main ---"
            git reset --hard origin/main

            echo "--- Cleanup deploy key ---"
            rm -f ~/.ssh/deploy_key

            echo "--- Restarting Odoo ---"
            sudo systemctl restart odoo || echo "WARNING: Odoo restart failed - manual restart needed"

            echo "======================================"
            echo "  DEPLOY COMPLETE"
            echo "  Time: $(date)"
            echo "======================================"
          EOF
