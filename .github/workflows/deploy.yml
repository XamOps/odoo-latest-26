name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSHH_KEY }}

      - name: Add host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSHH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          TOKEN="${{ secrets.GIT_TOKEN }}"
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSHH_USER }}@${{ secrets.SSHH_HOST }} \
            "sudo bash -c '
              set -e
              echo --- Removing git lock if exists ---
              rm -f /opt/odoo/custom_addons/odoo-latest-26/.git/index.lock

              echo --- Fetching latest code ---
              cd /opt/odoo/custom_addons/odoo-latest-26

              git remote set-url origin https://oauth2:'"$TOKEN"'@github.com/XamOps/odoo-latest-26.git
              git fetch origin main

              echo --- Resetting to origin/main ---
              git reset --hard origin/main

              echo --- Resetting remote url ---
              git remote set-url origin https://github.com/XamOps/odoo-latest-26.git

              echo --- Restarting Odoo service ---
              systemctl restart odoo

              echo --- Deploy complete ---
            '"
