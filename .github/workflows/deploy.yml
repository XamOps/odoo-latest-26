name: Deploy to AWS
on:
  push:
    branches: [preprod]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to EC2
        run: |
          cd /opt/odoo/custom_addons/odoo-latest-26
          git fetch origin preprod
          git reset --hard origin/preprod
          sudo systemctl restart odoo

