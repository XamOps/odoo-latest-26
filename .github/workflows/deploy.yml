name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSHH_KEY }}

      - name: Add hosts to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSHH_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Copy deploy key to EC2
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -o StrictHostKeyChecking=no /tmp/deploy_key \
            ${{ secrets.SSHH_USER }}@${{ secrets.SSHH_HOST }}:/home/ubuntu/.ssh/deploy_key
          rm -f /tmp/deploy_key

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSHH_USER }}@${{ secrets.SSHH_HOST }} << 'EOF'
            set -e

            echo "--- Setup deploy key ---"
            chmod 600 ~/.ssh/deploy_key
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/deploy_key

            echo "--- Adding github.com to known_hosts ---"
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

            echo "--- Test GitHub connection ---"
            ssh -T git@github.com || true

            echo "--- Removing git lock if exists ---"
            rm -f /opt/odoo/custom_addons/odoo-latest-26/.git/index.lock

            echo "--- Fetching latest code ---"
            cd /opt/odoo/custom_addons/odoo-latest-26
            git fetch origin main

            echo "--- Resetting to origin/main ---"
            git reset --hard origin/main

            echo "--- Cleanup deploy key ---"
            rm -f ~/.ssh/deploy_key

            echo "--- Restarting Odoo ---"
            sudo systemctl restart odoo

            echo "--- Deploy complete ---"
          EOF
