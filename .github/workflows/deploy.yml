name: Deploy to AWS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSHH_KEY }}
      - name: Add host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSHH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy to EC2
        run: |
          ssh -tt ${{ secrets.SSHH_USER }}@${{ secrets.SSHH_HOST }} << 'EOF'
            cd /opt/odoo/custom_addons/odoo-latest-26
            git fetch https://${{ secrets.GIT_TOKEN }}@github.com/XamOps/odoo-latest-26.git main
            git reset --hard FETCH_HEAD
            sudo systemctl restart odoo
            exit
          EOF
