name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSHH_KEY }}

      - name: Add to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSHH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.SSHH_USER }}@${{ secrets.SSHH_HOST }} \
          "GIT_TOKEN=${{ secrets.GIT_TOKEN }} bash -s" << 'EOF'
          set -e
          cd /opt/odoo/custom_addons/odoo-latest-26
          git remote set-url origin https://$GIT_TOKEN@github.com/XamOps/odoo-latest-26.git
          git fetch origin main
          git reset --hard origin/main
          sudo systemctl restart odoo
          echo "Deploy Successful!"
          EOF
