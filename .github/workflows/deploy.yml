name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSHH_KEY }}
            ${{ secrets.DEPLOY_KEY }}

      - name: Add hosts to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSHH_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            -o ForwardAgent=yes \
            ${{ secrets.SSHH_USER }}@${{ secrets.SSHH_HOST }} << 'EOF'
            set -e

            echo "--- Adding github.com to known_hosts ---"
            ssh-keyscan -H github.com | sudo tee -a /root/.ssh/known_hosts > /dev/null

            echo "--- Removing git lock if exists ---"
            sudo rm -f /opt/odoo/custom_addons/odoo-latest-26/.git/index.lock

            echo "--- Fetching latest code ---"
            cd /opt/odoo/custom_addons/odoo-latest-26
            sudo SSH_AUTH_SOCK=$SSH_AUTH_SOCK git fetch origin main

            echo "--- Resetting to origin/main ---"
            sudo SSH_AUTH_SOCK=$SSH_AUTH_SOCK git reset --hard origin/main

            echo "--- Restarting Odoo ---"
            sudo systemctl restart odoo

            echo "--- Deploy complete ---"
          EOF
