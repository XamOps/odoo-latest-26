name: Deploy to AWS
on:
  push:
    branches: [preprod]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -tt ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            sudo rm -f /opt/odoo/custom_addons/odoo-latest-26/.git/index.lock
            cd /opt/odoo/custom_addons/odoo-latest-26
            sudo git -c credential.helper='!f() { echo username=git; echo password=${{ secrets.GIT_TOKEN }}; }; f' fetch origin preprod
            sudo git reset --hard origin/preprod
            nohup sudo systemctl restart odoo &
            exit
          EOF
