- name: Deploy to EC2
  run: |
    ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
      set -x

      echo 'Checking folder'
      ls /home/ubuntu

      echo 'Go to project'
      cd /home/ubuntu/odoo-latest-26 || exit 1

      echo 'Git status'
      git status

      echo 'Pull code'
      git pull origin main

      echo 'Restart service'
      sudo systemctl restart odoo
    "
